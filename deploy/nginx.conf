# Host nginx server block for Main Vibe: /etc/nginx/sites-available/netstats, symlinked into
# sites-enabled. certbot adds the 443 listener and the redirect when it issues the certificate.

server {
    listen 80;
    server_name globe.sundbergsolutions.se;

    # The page is mostly three.js. The event stream arrives gzipped already, and nginx passes that on.
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json;

    location / {
        proxy_pass         http://127.0.0.1:8084;   # claimed in theted/infrastructure the-box.md
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
