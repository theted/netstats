name: CI

on:
  pull_request:
  # deploy.yml calls this, so tests gate every deploy of the commit being deployed.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: npm ci
        working-directory: web
      # Typechecks too. The Go build embeds web/dist, so this comes first.
      - run: npm run build
        working-directory: web
      - run: go vet ./...
      - run: go test ./internal/... ./cmd/...
